package: hostname

# The hostname binary strictly links against the core GNU C Library
package-dependencies:
  - libc6

slices:
  # Contains the core 'hostname' executable and related symlinks
  bins:
    essential:
      - hostname_copyright
    paths:
      - /bin/hostname
      # Typical fallback symlinks pointing to the core utility
      - /bin/dnsdomainname
      - /bin/domainname
      - /bin/nisdomainname
      - /bin/ypdomainname

  # Legally mandatory package copyright and tracking information
  copyright:
    paths:
      - /usr/share/doc/hostname/copyright
      - /usr/share/doc/hostname/changelog.Debian.gz
