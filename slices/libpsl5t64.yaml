package: libpsl5t64

# libpsl depends on core system libraries
package-dependencies:
  - libc6: [libs]
  - libicu74: [libs]

slices:
  # Core libpsl shared libraries
  libs:
    essential:
      - libpsl5t64_copyright
      - libc6_libs
      - libicu74_libs
    contents:
      /usr/lib/x86_64-linux-gnu/libpsl.so.5: {}
      /usr/lib/x86_64-linux-gnu/libpsl.so.5.3.4: {}
      #/usr/share/libpsl/: {}

  # Development headers (optional, for building against libpsl)
  dev:
    essential:
      - libpsl5t64_copyright
      - libpsl5t64_libs
      - libc6_libs
    paths:
      - /usr/include/libpsl*.h
      - /usr/lib/x86_64-linux-gnu/libpsl*.so
      - /usr/lib/x86_64-linux-gnu/pkgconfig/libpsl*.pc

  # Legally required copyright documentation
  copyright:
    paths:
      - /usr/share/doc/libpsl*/copyright
      - /usr/share/doc/libpsl*/changelog.Debian.gz
