# Local-testing equivalent of the nginx.conf rendered by django-production-chart
# (templates/_proxy_server.tpl) for proxyServer.enabled. Keep in sync with it.
# Difference: /static and /media are NOT defined here; they come from the
# app's locations.conf (see docker-compose.yaml), the way apps supply them today.
worker_processes 1;
error_log  /dev/stderr notice;
pid /tmp/nginx.pid;
events {
  worker_connections 5000;
  accept_mutex off;
}
http {
  proxy_temp_path /tmp/proxy_temp;
  client_body_temp_path /tmp/client_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
  access_log /dev/stdout main;
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  upstream app_server {
    server unix:/var/run/gunicorn/gunicorn.sock fail_timeout=0;
  }
  map $http_x_forwarded_proto $xfproto {
    default $http_x_forwarded_proto;
    ''      $scheme;
  }
  server {
    listen 8080 default_server;
    charset utf-8;
    underscores_in_headers on;
    port_in_redirect off;
    client_max_body_size 4G;
    location = /favicon.ico {
        return 204;
    }
    location /healthz {
      return 200;
    }
    # readiness: passes through to the app; <500 is ready (see chart template)
    location = /readyz {
      access_log off;
      proxy_set_header Host $http_host;
      proxy_pass http://app_server/;
      proxy_intercept_errors on;
      error_page 300 301 302 303 304 307 308 400 401 402 403 404 405 406 408 409 410 411 412 413 414 415 416 417 418 421 422 423 424 425 426 428 429 431 451 =200 @ready_ok;
    }
    location @ready_ok {
      return 200;
    }
    include /etc/nginx/includes/locations.conf;
    location / {
      try_files $uri @proxy_to_app;
    }
    location @proxy_to_app {
      proxy_pass_request_headers on;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $xfproto;
      proxy_set_header Host $http_host;
      proxy_redirect off;
      proxy_pass http://app_server;
    }
  }
}
